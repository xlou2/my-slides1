<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배포 성공</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:#F6C744;
    font-family:'Noto Sans KR','Noto Sans CJK KR',-apple-system,'Malgun Gothic',sans-serif;
    word-break:keep-all;overflow-wrap:anywhere;
    padding:24px;
  }
  @media (prefers-reduced-motion: no-preference){
    .card{animation:up .5s ease}
  }
  @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .card{
    background:#111;color:#fff;
    border-radius:28px;
    padding:56px 48px;
    max-width:520px;width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
    text-align:center;
  }
  .emoji{font-size:56px;line-height:1}
  h1{
    font-size:clamp(28px,5vw,40px);
    margin-top:20px;
    text-wrap:balance;
  }
  .sub{
    margin-top:12px;
    font-size:18px;
    color:#ccc;
    text-wrap:pretty;
  }
  .meta{
    margin-top:32px;
    padding-top:24px;
    border-top:1px solid #333;
    font-size:14px;
    color:#888;
  }
  .meta b{color:#F6C744}
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🎉</div>
    <h1>배포 성공</h1>
    <p class="sub">이 화면이 보이면 성공</p>
    <div class="meta">AI 웹슬라이드 배포 실습 · <b>가천대학교</b></div>
  </div>
</body>
</html>
